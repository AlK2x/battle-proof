services:
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: user-app
    ports: 
      - 8080:8080
    environment:
      - MYSQL_DSN=root@tcp(userdb:3306)/user
      - APP_PORT=:8080
    depends_on:
      userdb:
        condition: service_healthy
    networks:
      - app-network
  userdb:
    image: 'mysql:8'
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=user
      - MYSQL_USER=appuser
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - './user/database/mysql/user.sql:/docker-entrypoint-initdb.d/user.sql'
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local