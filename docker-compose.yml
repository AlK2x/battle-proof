services:
  user:
    image: user-app:latest
    restart: unless-stopped
    container_name: user-app
    ports: 
      - 8080:8080
    env_file:
      - user/.env
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - app-network
  jam:
    image: jam-app:latest
    restart: unless-stopped
    container_name: jam-app
    ports: 
      - 8081:8081
    env_file:
      - jam/.env
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - app-network
  battle:
    image: battle-app:latest
    restart: unless-stopped
    container_name: battle-app
    ports: 
      - 8082:8082
    env_file:
      - battle/.env
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - app-network
  mysqldb:
    image: 'mysql:8'
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - './database/mysql/init:/docker-entrypoint-initdb.d'
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local