openapi: "3.0.0"
info:
  version: 1.0.0
  title: Jam service
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: Return 200 OK if service is alive
      responses:
        '200':
          description: Service is alive
        '500':
          description: Service is not alive
  /jams:
    post:
      operationId: createJams
      summary: Create new jam
      description: Create new jam with 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - location
                - date
              properties:
                name:
                  type: string
                  description: Jam name
                  example: "Blues Jam Session"
                location:
                  type: string
                  description: Location of the jam
                  example: "Downtown Music Hall"
                date:
                  type: string
                  format: date-time
                  description: Date and time of the jam
                  example: "2025-05-15T19:00:00Z"
                created_by:
                  type: string
                  format: uuid
                  description: Identifier of the user who created the jam
                  example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
      responses:
        '201':
          description: Jam created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the created jam
                    example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
        '400':
          description: Bad request - missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: jamsList
      summary: Get list of all jams
      description: Get list of all jams
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Jam'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jams/{id}:
    get:
      operationId: findJamById
      summary: find jam by ID
      description: find jam by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: jam unique identifier
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
      responses:
        '200':
          description: jam found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jam'
        '404':
          description: jam not found
  /jams/{id}/participants:
    post:
      operationId: createJamParticipant
      summary: Create new jam participant
      description: Create new jam participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: jam unique identifier
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Participant'
      responses:
        '201':
          description: Jam participant created successfully
        '400':
          description: Bad request - missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteJamParticipant
      summary: remove jam participant
      description: remove jam participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: jam unique identifier
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Participant'
      responses:
        '200':
          description: Jam participant deleted successfully
        '400':
          description: Bad request - missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: jamParticipantList
      summary: Get list of all jams
      description: Get list of all jams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: jam unique identifier
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Jam:
      type: object
      required:
        - id
        - name
        - location
        - date
        - created_by
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the created jam
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
        name:
          type: string
          description: Jam name
          example: "Blues Jam Session"
        location:
          type: string
          description: Location of the jam
          example: "Downtown Music Hall"
        date:
          type: string
          format: date-time
          description: Date and time of the jam
          example: "2025-05-15T19:00:00Z"
        created_by:
          type: string
          format: uuid
          description: Identifier of the user who created the jam
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: error text description
          example: location is required
    Participant:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID
          example: "acde070d-8c4c-4f0d-9d8a-162843c10333"
        role:
          type: string
          description: Role of participant
          enum: [dancer, judge, media]
          example: "dancer"
      